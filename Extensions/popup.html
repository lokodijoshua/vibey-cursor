<!DOCTYPE html>
<html>
<body style="width:260px; font-family:sans-serif; padding:14px;">
  <h3 style="margin:0 0 10px;">VibeyCursor</h3>
  <div id="plan-pill" style="display:inline-block; font-size:11px; font-weight:800; padding:4px 12px; border-radius:999px; margin-bottom:10px; background:#2a2a35; color:#9a9aad;">FREE</div>
  <div id="status" style="font-size:12px; color:#666; margin-bottom:10px;">Checking license...</div>

  <div id="free-view">
    <input id="license-input" placeholder="Enter license key" style="width:100%; padding:6px; box-sizing:border-box; margin-bottom:8px;">
    <button id="activate-btn" style="width:100%; padding:8px; background:#a855f7; color:#fff; border:none; border-radius:6px; cursor:pointer;">Activate Pro</button>
    <a id="pricing-link" href="#" target="_blank" style="display:block; text-align:center; margin-top:10px; font-size:11px; color:#a855f7;">View Pricing →</a>
  </div>

  <div id="pro-view" style="display:none;">
    <p style="font-size:13px;">✅ Pro plan active</p>
    <p id="pro-email" style="font-size:11px; color:#9a9aad; word-break:break-all;"></p>
    <button id="deactivate-btn" style="width:100%; padding:6px; background:#333; color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:11px;">Sign out</button>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
